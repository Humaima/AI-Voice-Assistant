# Render Blueprint (Phase 10) — deploys this project's web service and
# Postgres database in one step via Render's "New > Blueprint" flow.
#
# NOT included here, and why:
# - Redis: configured in settings.py but never actually used anywhere
#   in this codebase (a leftover from early project scaffolding) — no
#   reason to pay for a managed service nothing reads from.
# - ChromaDB: Render's free tier covers Web Services + free Postgres,
#   but a custom Docker image as a Private Service (what ChromaDB
#   needs) requires a paid plan. This Blueprint sets
#   ENABLE_SEMANTIC_MEMORY=false, so the app runs on Postgres-based
#   short-term memory alone — no ChromaDB service needed at all. If
#   you're on a paid Render plan and want full semantic recall, deploy
#   ChromaDB as a Private Service (Docker Image:
#   chromadb/chroma:0.5.11) and set ENABLE_SEMANTIC_MEMORY=true plus
#   CHROMA_HOST/CHROMA_PORT to that service's internal address instead.
#
# After the Blueprint deploys, you still need to set the remaining
# secrets (GROQ_API_KEY, ELEVENLABS_API_KEY, TWILIO_*, etc.) in the
# Render dashboard — Blueprints deliberately don't commit real secrets
# to your repo.

services:
  - type: web
    name: voice-ai-assistant
    runtime: docker
    dockerfilePath: ./docker/Dockerfile.prod
    dockerContext: .
    healthCheckPath: /health
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: ENABLE_SEMANTIC_MEMORY
        value: "false"
      - key: POSTGRES_USER
        fromDatabase:
          name: voice-ai-assistant-db
          property: user
      - key: POSTGRES_PASSWORD
        fromDatabase:
          name: voice-ai-assistant-db
          property: password
      - key: POSTGRES_HOST
        fromDatabase:
          name: voice-ai-assistant-db
          property: host
      - key: POSTGRES_PORT
        fromDatabase:
          name: voice-ai-assistant-db
          property: port
      - key: POSTGRES_DB
        fromDatabase:
          name: voice-ai-assistant-db
          property: database
      # Everything below has no safe default — set these manually in
      # the Render dashboard after the first deploy (Blueprints won't
      # commit real secrets to your repo, which is the point):
      # GROQ_API_KEY, ELEVENLABS_API_KEY, ELEVENLABS_VOICE_ID,
      # TWILIO_ACCOUNT_SID, TWILIO_AUTH_TOKEN, TWILIO_WHATSAPP_NUMBER,
      # PUBLIC_BASE_URL (your Render URL, known only after first
      # deploy), DEBUG_API_TOKEN, and media storage:
      # MEDIA_STORAGE_BACKEND=s3, S3_BUCKET_NAME, S3_REGION,
      # S3_ENDPOINT_URL, AWS_ACCESS_KEY_ID, AWS_SECRET_ACCESS_KEY —
      # recommended free provider: Backblaze B2 (genuinely no credit
      # card required to sign up; see README's Phase 10 walkthrough,
      # Part 1, for exact setup steps).

databases:
  - name: voice-ai-assistant-db
    databaseName: voiceai_db
    user: voiceai
    plan: free
